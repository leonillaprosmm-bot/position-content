<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Scroll</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Картинка по центру, не скроллится -->
    <div class="center-image">
        <img src="assets/IMG_5436-removebg-preview.png" alt="">
    </div>

    <!-- Секции с текстом, фон меняется при скролле -->
    <section class="section" data-bg="#0a0a1a" data-palette="0">
        <div class="content">
            <h2>Секция 1</h2>
            <p>Тут будет текст</p>
        </div>
    </section>

    <section class="section" data-bg="#1a0a1a" data-palette="1">
        <div class="content">
            <h2>Секция 2</h2>
            <p>Тут будет текст</p>
        </div>
    </section>

    <section class="section" data-bg="#0a1a1a" data-palette="2">
        <div class="content">
            <h2>Секция 3</h2>
            <p>Тут будет текст</p>
        </div>
    </section>

    <section class="section" data-bg="#1a1a0a" data-palette="3">
        <div class="content">
            <h2>Секция 4</h2>
            <p>Тут будет текст</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
