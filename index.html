<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афиша</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&family=Playfair+Display:wght@400;700&family=Bebas+Neue&family=Cormorant+Garamond:wght@300;500&family=Unbounded:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Картинка по центру, не скроллится -->
    <div class="center-image">
        <img src="assets/IMG_5436-removebg-preview.png" alt="">
    </div>

    <!-- Кнопка переключения стиля текста (справа сверху) -->
    <button id="style-toggle" class="style-toggle" aria-label="Сменить стиль текста">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </button>

    <!-- Контент поверх фона -->
    <div class="poster">
        <div class="poster-inner">
            <div class="poster-meta">Дата · Место</div>
            <h1 class="poster-title">25 октября</h1>
            <div class="poster-sub">м. Волгоградский проспект</div>
            <div class="poster-divider"></div>
            <div class="poster-info">3 часа + съёмка селектов</div>
            <div class="poster-time">17:00 — 20:00</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
